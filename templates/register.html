{% extends "base.html" %}
{% block title %}Register – Foodie Delight{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-user-plus"></i>
            <h2>Create Account</h2>
            <p>Join Foodie Delight and start ordering</p>
        </div>

        {% if error %}
        <div class="auth-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <div id="regError" class="auth-error" style="display:none">
            <i class="fas fa-exclamation-circle"></i> <span id="regErrorMsg"></span>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Full Name *</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="reg_name" placeholder="John Doe" value="{{ form.full_name if form else '' }}">
                </div>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="reg_phone" placeholder="+91 99999 99999" value="{{ form.phone if form else '' }}">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Email Address *</label>
            <div class="input-icon-wrap">
                <i class="fas fa-envelope"></i>
                <input type="email" id="reg_email" placeholder="you@example.com" value="{{ form.email if form else '' }}">
            </div>
        </div>

        <div class="form-group">
            <label>Delivery Address</label>
            <div class="input-icon-wrap">
                <i class="fas fa-map-marker-alt"></i>
                <input type="text" id="reg_address" placeholder="123 Main St, City" value="{{ form.address if form else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Password *</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg_password" placeholder="Min 6 characters">
                </div>
            </div>
            <div class="form-group">
                <label>Confirm Password *</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg_confirm" placeholder="Repeat password">
                </div>
            </div>
        </div>

        <button class="auth-btn" id="registerBtn">
            <i class="fas fa-user-plus"></i> Create Account
        </button>

        <p class="auth-divider">Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function doRegister() {
    const full_name        = document.getElementById('reg_name').value.trim();
    const email            = document.getElementById('reg_email').value.trim();
    const phone            = document.getElementById('reg_phone').value.trim();
    const address          = document.getElementById('reg_address').value.trim();
    const password         = document.getElementById('reg_password').value;
    const confirm_password = document.getElementById('reg_confirm').value;
    const errBox           = document.getElementById('regError');
    const errMsg           = document.getElementById('regErrorMsg');
    const btn              = document.getElementById('registerBtn');

    errBox.style.display = 'none';

    if (!full_name || !email || !password || !confirm_password) {
        errMsg.textContent = 'Please fill in all required fields.';
        errBox.style.display = 'flex'; return;
    }
    if (password !== confirm_password) {
        errMsg.textContent = 'Passwords do not match.';
        errBox.style.display = 'flex'; return;
    }
    if (password.length < 6) {
        errMsg.textContent = 'Password must be at least 6 characters.';
        errBox.style.display = 'flex'; return;
    }

    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

    try {
        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name, email, phone, address, password, confirm_password })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/';
        } else {
            errMsg.textContent = data.error || 'Registration failed.';
            errBox.style.display = 'flex';
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
        }
    } catch(e) {
        errMsg.textContent = 'Network error. Please try again.';
        errBox.style.display = 'flex';
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
    }
}

document.getElementById('registerBtn').addEventListener('click', doRegister);
document.getElementById('reg_confirm').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
{% endblock %}
